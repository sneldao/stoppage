[package]
name = "attestation_validator"
version = "0.1.0"
description = "Stoppage attestation validator: verifies an operator-signed sports statistic observation (ed25519 precompile, same transaction) and returns a bool over CPI"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "attestation_validator"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
# Silence `unexpected_cfgs` warnings from Anchor macro internals.
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
